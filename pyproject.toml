[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fima"
version = "0.4.0"
description = "A Python package for retrieving and analyzing data from Iran's financial markets."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hemo Boghosian", email = "HemoBoghosian@gmail.com" }
]
keywords = [
    "Iran financial markets",
    "TSETMC",
    "Iran Mercantile Exchange",
    "Iran Fara Bourse",
    "options"
]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "jdatetime>=3.8.2",
    "lxml",
    "mibian>=0.1.3",
    "numpy>=1.26.3",
    "pandas>=2.2.3",
    "persian>=0.5.0",
    "requests>=2.32.3",
    "scipy>=1.13.1",
    "truststore",
    "urllib3"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-timeout"
]

[project.urls]
Homepage = "https://github.com/hemoboghosian/fima"
Repository = "https://github.com/hemoboghosian/fima"
PyPI = "https://pypi.org/project/fima/"

[tool.setuptools]
packages = ["fima"]
include-package-data = false
